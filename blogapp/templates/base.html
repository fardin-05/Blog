<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog | Premium Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-nav {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid #6366f1;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <nav class="glass-nav sticky top-0 z-50 py-4 shadow-2xl">
        <div class="container mx-auto px-6 lg:px-12 flex justify-between items-center">
            <a href="{% url 'home' %}" class="flex items-center space-x-2 group">
                <div class="w-10 h-10 bg-gradient-to-tr from-indigo-600 to-purple-500 rounded-xl flex items-center justify-center shadow-lg group-hover:rotate-12 transition-transform">
                    <span class="text-white font-black text-xl">M</span>
                </div>
                <span class="font-black text-2xl tracking-tighter text-white">MY<span class="text-indigo-400">BLOG.</span></span>
            </a>

            <div class="hidden md:block flex-1 max-w-xs mx-8">
                <form method="get" action="{% url 'search_posts' %}" class="relative">
                    <input type="text" name="q" placeholder="Search..." class="w-full bg-slate-800 text-white rounded-xl py-2 px-4 pl-10 focus:ring-2 focus:ring-indigo-500 outline-none border border-slate-700">
                    <svg class="w-4 h-4 absolute left-3 top-3 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </form>
            </div>

            <div class="flex items-center space-x-4">
                {% if user.is_authenticated %}
                    <a href="{% url 'create_post' %}" class="hidden sm:block text-slate-300 hover:text-white font-bold text-xs uppercase tracking-widest transition">New Post</a>
                    <a href="{% url 'logout' %}" class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2 rounded-xl font-bold text-sm transition-all shadow-lg shadow-rose-500/20 active:scale-95">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="relative inline-flex items-center justify-center px-7 py-2.5 overflow-hidden font-bold text-white transition-all bg-indigo-600 rounded-xl group hover:bg-indigo-700 shadow-xl shadow-indigo-500/30 active:scale-95">
                        <span class="absolute top-0 left-0 w-40 h-40 -mt-10 -ml-3 transition-all duration-700 bg-red-500 rounded-full blur-md ease opacity-20 group-hover:-translate-x-10 group-hover:-translate-y-10"></span>
                        <span class="relative flex items-center">Login</span>
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto mt-10 px-4 lg:px-12">
        {% block content %}{% endblock %}
    </main>

    <footer class="w-full bg-slate-950 text-white mt-20 border-t-4 border-indigo-600">
        <div class="container mx-auto px-6 lg:px-12 py-12">
            <div class="flex flex-col md:flex-row justify-between items-center gap-8">
                <div class="text-center md:text-left">
                    <h2 class="text-3xl font-black tracking-tighter italic">MYBLOG<span class="text-indigo-500">.</span></h2>
                    <p class="text-slate-500 text-sm mt-1">Premium Storytelling Platform</p>
                </div>
                <div class="flex space-x-6">
                    <a href="https://github.com/fardin-05" class="p-3 bg-slate-900 rounded-xl hover:bg-indigo-600 transition-all">GitHub</a>
                    <a href="https://linkedin.com/in/fardin-khan-7726062a9/" class="p-3 bg-slate-900 rounded-xl hover:bg-blue-600 transition-all">LinkedIn</a>
                </div>
                <div class="text-center md:text-right">
                    <p class="text-xs font-bold text-slate-600 uppercase tracking-widest leading-relaxed">
                        &copy; 2025 Crafted By <br> <span class="text-indigo-400 text-sm">Fardin Khan</span>
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        function togglePost(id) {
            const shortDiv = document.getElementById('short-' + id);
            const fullDiv = document.getElementById('full-' + id);
            const btnText = document.getElementById('btn-text-' + id);
            if (fullDiv.classList.contains('hidden')) {
                fullDiv.classList.remove('hidden');
                shortDiv.classList.add('hidden');
                btnText.innerText = 'See Less';
            } else {
                fullDiv.classList.add('hidden');
                shortDiv.classList.remove('hidden');
                btnText.innerText = 'See More';
            }
        }
    </script>
</body>
</html>
